name: Keep Render backend warm

on:
  schedule:
    # Every 13 minutes - keeps the free-tier Render web service from
    # spinning down after its ~15 minute idle timeout.
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 30 https://millionmindsmain-backend.onrender.com/ \
            && echo "Backend responded OK" \
            || echo "Ping failed (likely mid cold-start) - non-fatal"
